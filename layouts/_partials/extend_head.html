<link rel="preload" href="{{ "fonts/inter-latin-wght-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url("{{ "fonts/inter-latin-wght-normal.woff2" | relURL }}") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root { --accent: #1f6f78; --accent-soft: rgba(31, 111, 120, 0.12); --topic-homelab-ai: #1f6f78; --topic-vmware: #76557e; }
  .dark { --accent: #6cc3c9; --accent-soft: rgba(108, 195, 201, 0.16); --topic-homelab-ai: #6cc3c9; --topic-vmware: #cba2d4; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .logo a { font-weight: 700; letter-spacing: -0.01em; column-gap: 0; }
  .logo a::after { content: "."; color: var(--accent); }
  .post-content a { color: var(--accent); box-shadow: 0 1px 0 var(--accent); }
  .post-content a:hover { background: var(--accent-soft); }
  .home-info .entry-content a { color: var(--accent); }
  .post-tags li a, .entry-footer a { transition: color .15s; }
  .post-tags li a:hover, .entry-header h2:hover, .post-title:hover { color: var(--accent); }
  .post-entry:hover { border-color: var(--accent); }
  .entry-cover img { border-radius: var(--radius); }
  /* Topic label (categories): teal for Homelab & AI, aubergine for VMware. */
  .topic { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--topic-color, var(--secondary)); }
  .topic::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .topic:hover { text-decoration: underline; }
  .topic-homelab-ai { --topic-color: var(--topic-homelab-ai); }
  .topic-vmware { --topic-color: var(--topic-vmware); }
  .post-entry:has(.topic-homelab-ai) { border-left: 3px solid var(--topic-homelab-ai); }
  .post-entry:has(.topic-vmware) { border-left: 3px solid var(--topic-vmware); }
  .post-entry:has(.topic-homelab-ai):hover { border-color: var(--topic-homelab-ai); }
  .post-entry:has(.topic-vmware):hover { border-color: var(--topic-vmware); }
  .post-meta a.topic { color: var(--topic-color, var(--secondary)); text-decoration: none; margin-right: 2px; }
  .post-meta a.topic:hover { text-decoration: underline; text-decoration-style: solid; }
  .how-written {
    margin: var(--content-gap) 0;
    padding: 12px 16px;
    border-left: 3px solid var(--accent);
    background: var(--code-bg);
    border-radius: var(--radius);
    font-size: 0.9em;
    line-height: 1.6;
    color: var(--secondary);
  }
  .how-written a { color: var(--accent); text-decoration: underline; }
  /* TL;DR box (shortcode tldr), same family as .how-written. */
  .tldr { margin: var(--content-gap) 0 calc(var(--content-gap) * 1.5); padding: 14px 18px 6px; border-left: 3px solid var(--accent); background: var(--code-bg); border-radius: var(--radius); font-size: 0.95em; line-height: 1.6; }
  .tldr-label { display: block; font-size: 0.78em; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .tldr ul { margin: 0; padding-left: 20px; }
  .tldr li { margin-bottom: 6px; }
  /* Search as an icon in the menu. */
  .menu-icon { display: inline-block; vertical-align: -3px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* Topics overview: posts per topic in the topic colour. */
  .topic-section { margin: calc(var(--content-gap) * 1.5) 0; padding-left: 16px; border-left: 3px solid var(--topic-color, var(--border)); }
  .topic-section h2 { margin: 0 0 4px; font-size: 1.35em; }
  .topic-section h2 .topic { font-size: 0.72em; }
  .topic-description { margin: 0 0 14px; color: var(--secondary); }
  .topic-posts { list-style: none; margin: 0; padding: 0; }
  .topic-posts li { margin: 0 0 14px; }
  .topic-posts li > a { font-weight: 600; color: var(--primary); }
  .topic-posts li > a:hover { color: var(--topic-color, var(--accent)); }
  .topic-post-meta { display: block; font-size: 0.85em; color: var(--secondary); margin: 2px 0; }
  .topic-posts p { margin: 0; font-size: 0.92em; color: var(--secondary); line-height: 1.5; }
  /* Interaction row under the author block: discuss, share, correct. */
  .post-actions { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 var(--content-gap); font-size: 0.9em; }
  .post-actions a, .post-actions .share-btn { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: none; }
  .post-actions a:hover, .post-actions .share-btn:hover { text-decoration: underline; }
  .post-actions .share-hint { color: var(--secondary); }
  /* Author block at the end of posts and portrait on About. */
  .author-card { display: flex; gap: 16px; align-items: flex-start; margin: calc(var(--content-gap) * 1.5) 0 var(--content-gap); padding: 16px 0 0; border-top: 1px solid var(--border); font-size: 0.92em; line-height: 1.55; color: var(--secondary); }
  .post-content .author-card img, .author-card img { width: 72px; height: 72px; border-radius: 50%; flex: none; object-fit: cover; }
  .author-card strong { display: block; color: var(--primary); margin-bottom: 2px; }
  .author-card p { margin: 0 0 4px; }
  .author-card a { color: var(--accent); }
  .post-content .about-photo, .about-photo { float: right; width: 128px; height: 128px; border-radius: 50%; margin: 0 0 12px 24px; object-fit: cover; }
  @media (max-width: 520px) { .post-content .about-photo, .about-photo { float: none; display: block; margin: 0 0 16px; width: 112px; height: 112px; } }
</style>

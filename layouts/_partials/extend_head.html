<link rel="preload" href="{{ "fonts/inter-latin-wght-normal.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-display: swap;
    font-weight: 100 900;
    src: url("{{ "fonts/inter-latin-wght-normal.woff2" | relURL }}") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root { --accent: #1f6f78; --accent-soft: rgba(31, 111, 120, 0.12); --topic-homelab-ai: #1f6f78; --topic-vmware: #4f5d9c; }
  .dark { --accent: #6cc3c9; --accent-soft: rgba(108, 195, 201, 0.16); --topic-homelab-ai: #6cc3c9; --topic-vmware: #a3adec; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .logo a { font-weight: 700; letter-spacing: -0.01em; column-gap: 0; }
  .logo a::after { content: "."; color: var(--accent); }
  .post-content a { color: var(--accent); box-shadow: 0 1px 0 var(--accent); }
  .post-content a:hover { background: var(--accent-soft); }
  .home-info .entry-content a { color: var(--accent); }
  .post-tags li a, .entry-footer a { transition: color .15s; }
  .post-tags li a:hover, .entry-header h2:hover, .post-title:hover { color: var(--accent); }
  .post-entry:hover { border-color: var(--accent); }
  .entry-cover img { border-radius: var(--radius); }
  /* Topic label (categories): teal for Homelab & AI, slate blue for VMware. */
  .topic { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--topic-color, var(--secondary)); }
  .topic::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .topic:hover { text-decoration: underline; }
  .topic-homelab-ai { --topic-color: var(--topic-homelab-ai); }
  .topic-vmware { --topic-color: var(--topic-vmware); }
  .post-entry:has(.topic-homelab-ai) { border-left: 3px solid var(--topic-homelab-ai); }
  .post-entry:has(.topic-vmware) { border-left: 3px solid var(--topic-vmware); }
  .post-entry:has(.topic-homelab-ai):hover { border-color: var(--topic-homelab-ai); }
  .post-entry:has(.topic-vmware):hover { border-color: var(--topic-vmware); }
  .post-meta a.topic { color: var(--topic-color, var(--secondary)); text-decoration: none; margin-right: 2px; }
  .post-meta a.topic:hover { text-decoration: underline; text-decoration-style: solid; }
  .how-written {
    margin: var(--content-gap) 0;
    padding: 12px 16px;
    border-left: 3px solid var(--accent);
    background: var(--code-bg);
    border-radius: var(--radius);
    font-size: 0.9em;
    line-height: 1.6;
    color: var(--secondary);
  }
  .how-written a { color: var(--accent); text-decoration: underline; }
</style>

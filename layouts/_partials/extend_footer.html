{{- /* Share button in .post-actions: native share sheet where the Web Share API exists (phones), otherwise copy the link. No third-party script. */ -}}
{{- /* .Type reads "page" in the footer context, so guard on .Kind. */ -}}
{{- if eq .Kind "page" }}
<script>
  document.querySelectorAll(".share-btn").forEach((btn) => {
    const hint = btn.querySelector(".share-hint");
    const data = { title: btn.dataset.title, url: btn.dataset.url };
    if (!navigator.share) btn.firstChild.textContent = "Copy link";
    btn.addEventListener("click", async () => {
      try {
        if (navigator.share) { await navigator.share(data); return; }
        await navigator.clipboard.writeText(data.url);
        hint.textContent = " copied";
        setTimeout(() => { hint.textContent = ""; }, 2000);
      } catch (e) { /* user cancelled the share sheet */ }
    });
  });
</script>
{{- end }}

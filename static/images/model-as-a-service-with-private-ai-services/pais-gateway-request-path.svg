<text x="60" y="682" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f4f6f8" text-anchor="start">Measured, one non-streaming request each:</text>
<text x="60" y="706" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a94a3" text-anchor="start">lab-fast 2.1 s, lab-balanced 1.6 s, lab-deep 1.7 s to the first byte. Load balancer, ingress and token check add about 30 ms; a bad token is rejected in 20 ms.</text>
<text x="60" y="730" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6774" text-anchor="start">Not in the path yet: the VKS cluster of the instance has one control plane node and no workers. It waits for local model endpoints (RTX 3090).</text>

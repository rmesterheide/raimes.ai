<text x="56" y="450" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f4f6f8" text-anchor="start">Two keys, two owners</text>
<text x="56" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="start">the point of brokering</text>
<text x="56" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a94a3" text-anchor="start">PAIS token: one per user or app, with an expiry date</text>
<text x="56" y="514" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a94a3" text-anchor="start">(30 days by default). It ends at the ingress.</text>

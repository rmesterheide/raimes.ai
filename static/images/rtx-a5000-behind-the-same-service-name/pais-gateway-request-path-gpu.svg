<text x="60" y="682" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f4f6f8" text-anchor="start">Measured, same prompt, 400 tokens per answer, one request and eight at once:</text>
<text x="60" y="706" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a94a3" text-anchor="start">Gemma 4 12B on the A5000 72.6 tok/s, eight at once 200 to 351 together. Same model on 16 vCPUs: 9.3 tok/s. Qwen3.8 27B on the card 31.2 / 154. Ollama on the 4090 70.5 / 103.</text>
<text x="60" y="730" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5d6774" text-anchor="start">Claude Haiku 83.9 / 703, Sonnet 107.1 / 741. One user cannot tell the backends apart; eight can. 15 GB of the card stayed idle: passthrough gives them to nobody (part 4).</text>

baseURL: https://raimes.ai/
languageCode: en-us
title: raimes.ai
theme: PaperMod
timeZone: Europe/Berlin
enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON   # feeds the built-in search

params:
  env: production
  description: "Notes on Claude Code, local AI and a homelab that runs them."
  images: ["/images/og-default.jpg"]
  assets:
    favicon: "/favicon.svg"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
  cover:
    hiddenInSingle: true
    linkFullImages: false
  author: Raiko Mesterheide
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowRssButtonInSectionTermList: true
  hideFooter: false
  footer:
    text: "[Privacy](/privacy/) · [Imprint](/imprint/) · [Written with Claude Code, checked by a human](/about/#how-this-site-is-written)"

  homeInfoParams:
    Title: "Hi, I'm Raiko."
    Content: >
      I run a small private AI platform at home: one GPU, local models, public
      models behind one gateway, and a Mac mini that runs Claude Code around the
      clock. By day I design the same thing at enterprise scale.


      This site is where I write down what I learn, with numbers.
      I decide, the agent builds, I check.


      New here? Start with [the voice box for my five-year-old](/posts/voice-assistant-for-a-five-year-old/)
      or [the one rule for GPU design](/posts/gpu-architecture-for-model-serving-on-vcf/).

  socialIcons:
    - name: github
      url: https://github.com/rmesterheide
    - name: linkedin
      url: https://www.linkedin.com/in/raikomesterheide/
    - name: rss
      url: /index.xml

  # Comments via giscus (GitHub Discussions). Fill in after enabling
  # Discussions on the repo and running https://giscus.app once.
  comments: false

  fuseOpts:
    isCaseSensitive: false
    threshold: 0.4
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: topics
      name: Topics
      url: /categories/
      weight: 15
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40

markup:
  highlight:
    noClasses: false
    lineNos: false
  goldmark:
    renderer:
      unsafe: true
